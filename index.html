<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protean Falcon Ventures</title>
    <style>
        :root {
            --beige: #F5F1E8;
            --beige-warm: #EAE2CC;
            --beige-light: #F7F3E9;
            --navy: #0A1F44;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 25% 15%, var(--beige-light) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 85%, var(--beige-warm) 0%, transparent 60%),
                var(--beige);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--navy);
            font-family: Georgia, "Times New Roman", ui-serif, serif;
        }

        .container {
            text-align: center;
            opacity: 0;
            animation: fadeIn 2s ease-out forwards;
            animation-delay: 0.3s;
            padding: 0 24px;
        }

        .logo {
            width: 80vw;
            max-width: 400px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .splash-line {
            margin-top: 40px;
            font-size: 14px;
            letter-spacing: 0.02em;
            color: var(--navy);
            opacity: 0.7;
        }

        .splash-line a {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid currentColor;
            padding-bottom: 1px;
            transition: opacity 0.2s ease;
        }

        .splash-line a:hover {
            opacity: 0.65;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.svg" alt="Protean Falcon Ventures" class="logo">
        <p class="splash-line">
            Site forthcoming
            <span aria-hidden="true">&nbsp;&middot;&nbsp;</span>
            <a href="mailto:info@proteanfalcon.com">info@proteanfalcon.com</a>
        </p>
    </div>

    <!-- Cloudflare Web Analytics -->
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "7210861ad46b47ea949793219fa66b97"}'></script>
    <!-- End Cloudflare Web Analytics -->
</body>
</html>
