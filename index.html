<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protean Falcon Ventures</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #050606;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Aurora Background */
        .aurora-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            filter: blur(100px);
            background: radial-gradient(circle at center, #050606 0%, #000 100%);
        }

        .blob {
            position: absolute;
            width: 80vw;
            height: 80vw;
            max-width: 800px;
            max-height: 800px;
            border-radius: 50%;
            mix-blend-mode: screen;
            opacity: 0.3;
            pointer-events: none;
        }

        .blob-1 {
            background: #50C878; /* Emerald */
            top: -20%;
            left: -10%;
            animation: drift1 25s infinite alternate ease-in-out;
        }

        .blob-2 {
            background: #4B0082; /* Indigo */
            bottom: -20%;
            right: -10%;
            animation: drift2 30s infinite alternate-reverse ease-in-out;
        }

        .blob-3 {
            background: #8F00FF; /* Violet */
            top: 40%;
            left: 30%;
            animation: drift3 20s infinite alternate ease-in-out;
        }

        @keyframes drift1 {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(15%, 10%) scale(1.2); }
        }

        @keyframes drift2 {
            from { transform: translate(0, 0) scale(1.1); }
            to { transform: translate(-10%, -15%) scale(0.9); }
        }

        @keyframes drift3 {
            from { transform: translate(0, 0); opacity: 0.2; }
            to { transform: translate(5%, -5%); opacity: 0.4; }
        }

        /* Logo Styling */
        .container {
            position: relative;
            z-index: 10;
            opacity: 0;
            animation: fadeIn 3s ease-in-out forwards;
            animation-delay: 0.5s;
            text-align: center;
        }

        .logo {
            width: 80vw;
            max-width: 400px;
            height: auto;
            /* Inverting the black logo to make it white/silver for the dark theme */
            filter: invert(1) drop-shadow(0 0 15px rgba(255, 255, 255, 0.1));
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.02);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="aurora-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    
    <div class="container">
        <img src="logo.svg" alt="Protean Falcon Ventures Logo" class="logo">
    </div>
</body>
</html>
